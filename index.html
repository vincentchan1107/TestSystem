<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>客户管理系统 | Supabase + GitHub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6 (免费图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Supabase JS 库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 自定义额外样式 -->
    <style>
        /* 自定义模态框动画和滚动条等 */
        .modal-transition {
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }
        body {
            background: #f4f7fc;
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        }
        .table-container::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            ring: 2px solid #3b82f6;
            border-color: #3b82f6;
        }
        .btn-loading {
            opacity: 0.7;
            pointer-events: none;
        }
        .toast-notify {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            transition: all 0.2s;
        }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- 全局Toast提示容器 -->
    <div id="toastContainer" class="toast-notify"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-10">
        <!-- 头部标题及用户状态区域 -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-3">
                    <i class="fas fa-users text-blue-600"></i>
                    客户管理系统
                </h1>
                <p class="text-gray-500 mt-1 text-sm">基于 Supabase 数据库 · 数据隔离 · 安全可靠</p>
            </div>
            <div id="userInfoArea" class="flex items-center gap-3 bg-white px-4 py-2 rounded-xl shadow-sm">
                <!-- 动态用户信息或登录/注册按钮 -->
                <div class="text-sm text-gray-600" id="userStatusText">未登录</div>
                <div id="authButtonContainer"></div>
            </div>
        </div>

        <!-- 登录/注册卡片 (默认显示, 登录后隐藏) -->
        <div id="authCard" class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8 transition-all">
            <div class="text-center mb-6">
                <i class="fas fa-lock text-blue-500 text-4xl mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800">账户认证</h2>
                <p class="text-gray-500 text-sm mt-1">使用邮箱密码登录或注册新账号</p>
            </div>
            <div class="mb-4">
                <div class="flex gap-2 border-b mb-4">
                    <button id="loginTabBtn" class="tab-btn py-2 px-4 text-blue-600 border-b-2 border-blue-600 font-medium">登录</button>
                    <button id="signupTabBtn" class="tab-btn py-2 px-4 text-gray-500 hover:text-gray-700">注册</button>
                </div>
                <!-- 登录表单 -->
                <div id="loginForm">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-medium mb-1">邮箱地址</label>
                        <input type="email" id="loginEmail" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-300" placeholder="customer@example.com">
                    </div>
                    <div class="mb-5">
                        <label class="block text-gray-700 text-sm font-medium mb-1">密码</label>
                        <input type="password" id="loginPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-300" placeholder="至少6位">
                    </div>
                    <button id="doLoginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">登录</button>
                </div>
                <!-- 注册表单(初始隐藏) -->
                <div id="signupForm" class="hidden">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-medium mb-1">邮箱地址</label>
                        <input type="email" id="signupEmail" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="your@email.com">
                    </div>
                    <div class="mb-5">
                        <label class="block text-gray-700 text-sm font-medium mb-1">密码</label>
                        <input type="password" id="signupPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="至少6位">
                    </div>
                    <button id="doSignupBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition">注册新账号</button>
                </div>
            </div>
            <div class="text-xs text-center text-gray-400 mt-4 border-t pt-4">
                首次使用请注册，数据将完全隔离<br>
                <a href="#" class="text-blue-500" id="gotoSignupLink">没有账号？立即注册</a>
            </div>
        </div>

        <!-- 客户管理主界面 (登录后展示) -->
        <div id="customerPanel" class="hidden">
            <!-- 操作栏 + 添加按钮 + 搜索 -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                <div class="relative w-full sm:w-80">
                    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="搜索客户姓名、公司或电话..." class="pl-10 pr-4 py-2 w-full border border-gray-300 rounded-xl shadow-sm focus:border-blue-400">
                </div>
                <button id="openAddModalBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl shadow flex items-center gap-2 transition">
                    <i class="fas fa-plus"></i> 新增客户
                </button>
            </div>

            <!-- 客户列表表格 (响应式滚动) -->
            <div class="bg-white rounded-2xl shadow-md overflow-hidden">
                <div class="table-container overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">姓名</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">公司</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">电话</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">邮箱</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">地址</th>
                                <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody" class="bg-white divide-y divide-gray-100">
                            <!-- 动态渲染客户数据 -->
                            <tr><td colspan="6" class="text-center py-8 text-gray-400">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="tableFooter" class="bg-gray-50 px-6 py-3 text-xs text-gray-500 border-t flex justify-between items-center">
                    <span id="recordCount">0 条记录</span>
                    <span><i class="fas fa-database"></i> Supabase 实时存储</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 模态框: 添加/编辑客户 -->
    <div id="customerModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 modal-transition invisible opacity-0">
        <div class="bg-white rounded-2xl w-full max-w-md mx-4 shadow-2xl transform transition-all">
            <div class="flex justify-between items-center border-b px-6 py-4">
                <h3 id="modalTitle" class="text-xl font-semibold text-gray-800">新增客户</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="editCustomerId" value="">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">姓名 <span class="text-red-500">*</span></label>
                    <input type="text" id="customerName" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="张三">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">公司</label>
                    <input type="text" id="customerCompany" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="某某科技有限公司">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">电话</label>
                    <input type="tel" id="customerPhone" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="13800000000">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                    <input type="email" id="customerEmail" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="contact@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">地址</label>
                    <input type="text" id="customerAddress" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="详细地址">
                </div>
            </div>
            <div class="flex justify-end gap-3 border-t px-6 py-4 bg-gray-50 rounded-b-2xl">
                <button id="cancelModalBtn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100">取消</button>
                <button id="saveCustomerBtn" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ======================= 配置区域 (已填入您的 Supabase 凭据) ========================
        const SUPABASE_URL = 'https://hazxfinkokifujqlmkcs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhenhmaW5rb2tpZnVqcWxta2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODQ2MzcsImV4cCI6MjA5MjM2MDYzN30.y3njujhhcoZW5WTirqkGvWbv962e4F2whVVP0VeQ6ic';
        // ====================================================================================
        
        // 全局变量
        let supabaseClient = null;
        let currentUser = null;
        let allCustomers = [];      // 存储当前用户的所有客户原始数据
        let searchKeyword = '';
        
        // DOM 元素
        const authCard = document.getElementById('authCard');
        const customerPanel = document.getElementById('customerPanel');
        const loginFormDiv = document.getElementById('loginForm');
        const signupFormDiv = document.getElementById('signupForm');
        const loginTabBtn = document.getElementById('loginTabBtn');
        const signupTabBtn = document.getElementById('signupTabBtn');
        const doLoginBtn = document.getElementById('doLoginBtn');
        const doSignupBtn = document.getElementById('doSignupBtn');
        const gotoSignupLink = document.getElementById('gotoSignupLink');
        const userStatusText = document.getElementById('userStatusText');
        const authButtonContainer = document.getElementById('authButtonContainer');
        const customerTableBody = document.getElementById('customerTableBody');
        const searchInput = document.getElementById('searchInput');
        const openAddModalBtn = document.getElementById('openAddModalBtn');
        const customerModal = document.getElementById('customerModal');
        const modalTitle = document.getElementById('modalTitle');
        const editCustomerId = document.getElementById('editCustomerId');
        const customerName = document.getElementById('customerName');
        const customerCompany = document.getElementById('customerCompany');
        const customerPhone = document.getElementById('customerPhone');
        const customerEmail = document.getElementById('customerEmail');
        const customerAddress = document.getElementById('customerAddress');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const saveCustomerBtn = document.getElementById('saveCustomerBtn');
        const recordCountSpan = document.getElementById('recordCount');
        
        // 辅助函数: 显示Toast通知
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-500' : (type === 'error' ? 'bg-red-500' : 'bg-blue-500');
            toast.className = `${bgColor} text-white px-5 py-3 rounded-lg shadow-lg mb-3 flex items-center gap-2 animate-bounce transition`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // 转义HTML防止XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }
        
        // 初始化Supabase客户端
        function initSupabase() {
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
                showToast('⚠️ Supabase 配置缺失，请检查代码', 'error');
                return false;
            }
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            return true;
        }
        
        // 检查用户会话并更新UI
        async function checkUserSession() {
            if (!supabaseClient) return;
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (session?.user) {
                currentUser = session.user;
                userStatusText.innerHTML = `<i class="fas fa-user-circle"></i> ${currentUser.email}`;
                authButtonContainer.innerHTML = `<button id="logoutBtn" class="text-red-500 hover:text-red-700 text-sm font-medium"><i class="fas fa-sign-out-alt"></i> 登出</button>`;
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) logoutBtn.onclick = handleLogout;
                authCard.classList.add('hidden');
                customerPanel.classList.remove('hidden');
                await loadCustomers();      // 加载客户数据
            } else {
                currentUser = null;
                userStatusText.innerHTML = '未登录';
                authButtonContainer.innerHTML = '';
                authCard.classList.remove('hidden');
                customerPanel.classList.add('hidden');
                allCustomers = [];
                renderCustomerTable();
            }
        }
        
        // 登出
        async function handleLogout() {
            await supabaseClient.auth.signOut();
            showToast('已安全登出', 'success');
            currentUser = null;
            checkUserSession();
        }
        
        // 加载客户数据 (按 user_id = currentUser.id)
        async function loadCustomers() {
            if (!currentUser) return;
            try {
                const { data, error } = await supabaseClient
                    .from('customers')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });
                if (error) throw error;
                allCustomers = data || [];
                renderCustomerTable();
                recordCountSpan.innerText = `${allCustomers.length} 条记录`;
            } catch (err) {
                console.error(err);
                showToast('加载客户失败: ' + err.message, 'error');
                allCustomers = [];
                renderCustomerTable();
            }
        }
        
        // 渲染表格 (带前端搜索过滤)
        function renderCustomerTable() {
            if (!customerTableBody) return;
            const keyword = searchKeyword.trim().toLowerCase();
            let filtered = [...allCustomers];
            if (keyword) {
                filtered = filtered.filter(c => 
                    (c.name && c.name.toLowerCase().includes(keyword)) ||
                    (c.company && c.company.toLowerCase().includes(keyword)) ||
                    (c.phone && c.phone.toLowerCase().includes(keyword)) ||
                    (c.email && c.email.toLowerCase().includes(keyword))
                );
            }
            if (filtered.length === 0) {
                customerTableBody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-400"><i class="fas fa-inbox"></i> 暂无客户数据，点击“新增客户”添加</td></tr>`;
                recordCountSpan.innerText = `${filtered.length} 条记录`;
                return;
            }
            let html = '';
            for (let cust of filtered) {
                html += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${escapeHtml(cust.name) || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${escapeHtml(cust.company) || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${escapeHtml(cust.phone) || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${escapeHtml(cust.email) || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600 max-w-xs truncate">${escapeHtml(cust.address) || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium">
                            <button class="edit-customer-btn text-blue-600 hover:text-blue-800 mr-3" data-id="${cust.id}"><i class="fas fa-edit"></i> 编辑</button>
                            <button class="delete-customer-btn text-red-600 hover:text-red-800" data-id="${cust.id}"><i class="fas fa-trash-alt"></i> 删除</button>
                        </td>
                    </tr>
                `;
            }
            customerTableBody.innerHTML = html;
            recordCountSpan.innerText = `${filtered.length} / ${allCustomers.length} 条记录`;
            
            // 绑定编辑删除事件
            document.querySelectorAll('.edit-customer-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = btn.getAttribute('data-id');
                    openEditModal(id);
                });
            });
            document.querySelectorAll('.delete-customer-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = btn.getAttribute('data-id');
                    confirmDeleteCustomer(id);
                });
            });
        }
        
        // 搜索监听
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                searchKeyword = e.target.value;
                renderCustomerTable();
            });
        }
        
        // 打开新增模态框
        function openAddModal() {
            modalTitle.innerText = '新增客户';
            editCustomerId.value = '';
            customerName.value = '';
            customerCompany.value = '';
            customerPhone.value = '';
            customerEmail.value = '';
            customerAddress.value = '';
            customerModal.classList.remove('invisible', 'opacity-0');
        }
        
        // 打开编辑模态框并填充数据
        function openEditModal(custId) {
            const customer = allCustomers.find(c => c.id === custId);
            if (!customer) return;
            modalTitle.innerText = '编辑客户';
            editCustomerId.value = customer.id;
            customerName.value = customer.name || '';
            customerCompany.value = customer.company || '';
            customerPhone.value = customer.phone || '';
            customerEmail.value = customer.email || '';
            customerAddress.value = customer.address || '';
            customerModal.classList.remove('invisible', 'opacity-0');
        }
        
        // 关闭模态框
        function closeModal() {
            customerModal.classList.add('invisible', 'opacity-0');
        }
        
        // 保存客户（新增或更新）
        async function saveCustomer() {
            if (!currentUser) {
                showToast('请先登录', 'error');
                return;
            }
            const id = editCustomerId.value;
            const name = customerName.value.trim();
            if (!name) {
                showToast('姓名不能为空', 'error');
                return;
            }
            const payload = {
                name: name,
                company: customerCompany.value.trim() || null,
                phone: customerPhone.value.trim() || null,
                email: customerEmail.value.trim() || null,
                address: customerAddress.value.trim() || null,
                user_id: currentUser.id,
                updated_at: new Date().toISOString()
            };
            try {
                if (id) {
                    // 更新
                    const { error } = await supabaseClient
                        .from('customers')
                        .update(payload)
                        .eq('id', id)
                        .eq('user_id', currentUser.id);
                    if (error) throw error;
                    showToast('客户信息更新成功', 'success');
                } else {
                    // 新增: 增加 created_at
                    payload.created_at = new Date().toISOString();
                    const { error } = await supabaseClient
                        .from('customers')
                        .insert(payload);
                    if (error) throw error;
                    showToast('客户添加成功', 'success');
                }
                closeModal();
                await loadCustomers();   // 刷新表格
            } catch (err) {
                console.error(err);
                showToast('操作失败: ' + err.message, 'error');
            }
        }
        
        // 确认删除客户
        async function confirmDeleteCustomer(custId) {
            const confirmDel = confirm('确定要删除该客户吗？数据将永久移除。');
            if (!confirmDel) return;
            try {
                const { error } = await supabaseClient
                    .from('customers')
                    .delete()
                    .eq('id', custId)
                    .eq('user_id', currentUser.id);
                if (error) throw error;
                showToast('删除成功', 'success');
                await loadCustomers();
            } catch (err) {
                showToast('删除失败: ' + err.message, 'error');
            }
        }
        
        // 认证功能: 登录
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) {
                showToast('请输入邮箱和密码', 'error');
                return;
            }
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                showToast(`欢迎回来，${data.user.email}`, 'success');
                await checkUserSession();
            } catch (err) {
                showToast('登录失败: ' + err.message, 'error');
            }
        }
        
        // 注册
        async function handleSignup() {
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            if (!email || !password) {
                showToast('请填写邮箱和密码', 'error');
                return;
            }
            if (password.length < 6) {
                showToast('密码至少6位', 'error');
                return;
            }
            try {
                const { data, error } = await supabaseClient.auth.signUp({ 
                    email, 
                    password,
                    options: { data: { full_name: email.split('@')[0] } }
                });
                if (error) throw error;
                if (data.user) {
                    showToast('注册成功！请登录', 'success');
                    // 切换到登录tab
                    document.getElementById('loginEmail').value = email;
                    document.getElementById('loginPassword').value = '';
                    loginTabBtn.click();
                } else {
                    showToast('注册异常，请重试', 'error');
                }
            } catch (err) {
                showToast('注册失败: ' + err.message, 'error');
            }
        }
        
        // UI 认证 Tab 切换
        function setAuthTab(tab) {
            if (tab === 'login') {
                loginFormDiv.classList.remove('hidden');
                signupFormDiv.classList.add('hidden');
                loginTabBtn.className = 'tab-btn py-2 px-4 text-blue-600 border-b-2 border-blue-600 font-medium';
                signupTabBtn.className = 'tab-btn py-2 px-4 text-gray-500 hover:text-gray-700';
            } else {
                loginFormDiv.classList.add('hidden');
                signupFormDiv.classList.remove('hidden');
                signupTabBtn.className = 'tab-btn py-2 px-4 text-blue-600 border-b-2 border-blue-600 font-medium';
                loginTabBtn.className = 'tab-btn py-2 px-4 text-gray-500 hover:text-gray-700';
            }
        }
        
        // 初始化事件绑定
        function bindEvents() {
            if (loginTabBtn) loginTabBtn.onclick = () => setAuthTab('login');
            if (signupTabBtn) signupTabBtn.onclick = () => setAuthTab('signup');
            if (gotoSignupLink) gotoSignupLink.onclick = (e) => { e.preventDefault(); setAuthTab('signup'); };
            if (doLoginBtn) doLoginBtn.onclick = handleLogin;
            if (doSignupBtn) doSignupBtn.onclick = handleSignup;
            if (openAddModalBtn) openAddModalBtn.onclick = openAddModal;
            if (closeModalBtn) closeModalBtn.onclick = closeModal;
            if (cancelModalBtn) cancelModalBtn.onclick = closeModal;
            if (saveCustomerBtn) saveCustomerBtn.onclick = saveCustomer;
            // 点击模态框背景关闭
            customerModal.addEventListener('click', (e) => {
                if (e.target === customerModal) closeModal();
            });
        }
        
        // 检测表是否存在的友好提醒 (不报错，仅提示，用户需手动建表)
        async function ensureTableSetup() {
            if (!supabaseClient) return;
            try {
                // 测试查询 customers 表是否存在，若无权限或不存在则提示配置
                const { error } = await supabaseClient.from('customers').select('id', { count: 'exact', head: true });
                if (error && error.code === '42P01') {
                    console.warn("表 'customers' 不存在，请按照提示创建");
                    showToast('⚠️ 未检测到 customers 表，请先在 Supabase SQL 编辑器中创建表', 'error');
                } else if (error && error.message.includes('permission')) {
                    showToast('⚠️ RLS 策略可能未配置，请设置允许用户操作自己的数据', 'error');
                }
            } catch(e) {}
        }
        
        // 启动应用
        async function initApp() {
            const valid = initSupabase();
            if (!valid) return;
            bindEvents();
            // 监听认证状态变化
            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
                    checkUserSession();
                } else if (event === 'SIGNED_OUT') {
                    checkUserSession();
                }
            });
            await checkUserSession();
            await ensureTableSetup();
        }
        
        // 启动
        initApp();
        
        // 在控制台输出Supabase建表指南，方便部署
        console.log("%c📌 Supabase 设置指南:\n1. 创建表 customers: \nCREATE TABLE customers (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  user_id uuid REFERENCES auth.users NOT NULL,\n  name text NOT NULL,\n  company text,\n  phone text,\n  email text,\n  address text,\n  created_at timestamptz DEFAULT now(),\n  updated_at timestamptz DEFAULT now()\n);\n\n2. 启用行级安全 (RLS):\nALTER TABLE customers ENABLE ROW LEVEL SECURITY;\n\n3. 创建策略:\nCREATE POLICY \"用户只能访问自己的客户\" ON customers\n  USING (auth.uid() = user_id)\n  WITH CHECK (auth.uid() = user_id);", "color: #16a34a; font-size: 12px");
    </script>
    <!-- 附加说明挂载 -->
    <div class="text-center text-xs text-gray-400 py-4 border-t mt-8 max-w-7xl mx-auto">
        <i class="fas fa-cloud-upload-alt"></i> 托管于 GitHub Pages | 数据安全存储在 Supabase
    </div>
</body>
</html>
